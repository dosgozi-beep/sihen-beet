<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIHEN BEET</title>
<meta name="description" content="ダビデの詩篇で遊ぶリズムゲーム。ブラウザで今すぐ無料。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0805; --ink:#f3e6cc; --mute:#a8957a; --gold:#d9a521; --gold2:#f6d77a;
  --wood:#2a180c; --wood2:#3b2413;
  --mincho:"Shippori Mincho B1",serif; --gothic:"Zen Kaku Gothic New",sans-serif;
  --vw-video:min(58vw, calc(50svh * 9 / 16), 360px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block}
button{font:inherit;color:inherit}

/* ===== HERO ===== */
.hero{isolation:isolate;position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:27svh 20px 10svh;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-10%;background:url(assets/bg_far.webp) center/cover;filter:blur(14px) brightness(.32) saturate(.9);transform:scale(1.1)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 42%,rgba(217,165,33,.18),transparent 70%),linear-gradient(transparent 70%,var(--bg));pointer-events:none}
/* rhythm leaking out around the frame */
#beat{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
.stage{position:relative;z-index:1;width:var(--vw-video);aspect-ratio:9/16;opacity:0;transform:translateY(16px);animation:rise 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px;background:#000;box-shadow:0 0 0 1px rgba(246,215,122,.35)}
.frame{position:absolute;pointer-events:none;left:-29.68%;top:-24.69%;width:159.36%;height:151.08%;background:url(assets/frame.webp) center/100% 100% no-repeat;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6)) drop-shadow(0 0 calc(18px + var(--beat,0) * 5px) rgba(217,165,33,calc(.25 + var(--beat,0) * .08)))}
.logo{position:absolute;z-index:3;left:50%;top:0;width:150%;transform:translate(-50%,-80%);filter:drop-shadow(0 10px 24px rgba(0,0,0,.7));opacity:0;animation:logoIn 1.1s cubic-bezier(.2,1.2,.3,1) .9s forwards}
.catch{position:absolute;z-index:3;left:50%;bottom:0;transform:translate(-50%,55%);white-space:nowrap;text-align:center;padding:14px 26px;background:radial-gradient(closest-side,rgba(12,8,5,.95),rgba(12,8,5,.8) 65%,rgba(12,8,5,0));opacity:0;animation:fade 1s ease 1.5s forwards}
.catch span{display:inline-block;font-family:var(--mincho);font-weight:800;font-size:clamp(20px,6vw,32px);letter-spacing:.22em;padding:.35em .6em .35em .82em;
  background:linear-gradient(180deg,#fff6d6,#f2c95a 55%,#b9780f);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #2a1406) drop-shadow(0 0 18px rgba(0,0,0,.9))}
.catch::before,.catch::after{content:"";position:absolute;top:50%;width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2))}
.catch::before{right:100%}.catch::after{left:100%;transform:scaleX(-1)}
.sound{position:absolute;z-index:4;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(246,215,122,.5);background:rgba(12,8,5,.6);color:var(--gold2);font-size:15px;cursor:pointer;backdrop-filter:blur(4px)}
.start{position:relative;z-index:2;margin-top:calc(var(--vw-video) * 16 / 9 * .265 + 22px);display:inline-flex;align-items:center;justify-content:center;gap:.6em;
  width:300px;height:64px;padding:0 0 0 .3em;font-family:var(--mincho);font-weight:800;font-size:18px;letter-spacing:.3em;color:#3a1a04;text-shadow:0 1px 0 rgba(255,240,200,.7);
  background:url(assets/btn.webp) center/100% 100% no-repeat;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));
  transition:filter .3s,transform .3s;opacity:0;animation:fade 1s ease 1.9s forwards}
.start:hover{filter:drop-shadow(0 10px 22px rgba(0,0,0,.6)) brightness(1.08);transform:translateY(-2px)}
.start::after{content:"";position:absolute;inset:0;-webkit-mask:url(assets/btn.webp) center/100% 100% no-repeat;mask:url(assets/btn.webp) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.5s ease-in-out 3s infinite}
.scroll{position:absolute;z-index:2;bottom:22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.4em;color:var(--mute);writing-mode:vertical-rl;opacity:0;animation:fade 1s ease 2.4s forwards}
.scroll::after{content:"";display:block;width:1px;height:38px;margin:10px auto 0;background:linear-gradient(var(--gold2),transparent);animation:drip 2s ease-in-out infinite}

/* ===== 縦書き ===== */
.words{position:relative;min-height:120svh;display:flex;align-items:center;justify-content:center;padding:18svh 16px;overflow:hidden}
.words::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--bg),rgba(12,8,5,0) 22%,rgba(12,8,5,0) 80%,var(--bg)),url(assets/night.webp) center 70%/cover}
@media (min-aspect-ratio:1/1){.words::before{background:linear-gradient(var(--bg),rgba(12,8,5,0) 22%,rgba(12,8,5,0) 80%,var(--bg)),url(assets/night_w.webp) center 60%/cover}}
.poem{z-index:1;position:relative;text-shadow:0 0 6px #000,0 2px 14px rgba(0,0,0,.95);writing-mode:vertical-rl;font-family:var(--mincho);font-weight:500;font-size:clamp(13px,calc((100vw - 40px) / 26),24px);line-height:2.2;letter-spacing:.28em;color:var(--ink);height:19em;max-width:100%}
.poem p{opacity:0;transform:translateY(-14px);filter:blur(6px);transition:opacity 1.6s ease,transform 1.6s ease,filter 1.6s ease}
.poem p.gap{margin-left:1.2em}
.poem.in p{opacity:1;transform:none;filter:none}
.poem em{font-style:normal;color:var(--gold2)}
.poem p:last-child{color:var(--mute);font-size:.8em}

/* ===== 収録曲：レコードを飾った部屋 ===== */
.room{position:relative;padding:12svh 0 14svh;overflow:hidden}
.head{position:relative;z-index:2;text-align:center;margin-bottom:44px}
.head small{display:block;font-size:11px;letter-spacing:.5em;color:var(--gold);margin-bottom:12px}
.head h2{font-family:var(--mincho);font-weight:700;font-size:clamp(22px,5.5vw,30px);letter-spacing:.25em}
.wall{position:relative;margin:0 auto;width:min(1180px,100%);padding:clamp(40px,7vw,80px) clamp(16px,5vw,64px) clamp(70px,10vw,110px);border-radius:4px;
  /* 部屋の壁（仮）：Geminiの room.webp が届いたら自動で差し替わる */
  background:
    radial-gradient(38% 30% at 22% 8%,rgba(255,214,140,.16),transparent 70%),
    radial-gradient(38% 30% at 78% 8%,rgba(255,214,140,.16),transparent 70%),
    linear-gradient(180deg,rgba(0,0,0,0) 86%,rgba(0,0,0,.55) 86.2%,#1a0f07 87%,var(--wood2) 88%,var(--wood) 100%),
    repeating-linear-gradient(90deg,#21160d 0 120px,#1d130b 120px 122px,#24180e 122px 240px),
    #1f150c;
  box-shadow:inset 0 0 120px rgba(0,0,0,.85)}
.wall.photo{background:linear-gradient(rgba(12,8,5,.1),rgba(12,8,5,.25)),var(--room) center/cover}
.wall::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--bg),transparent 8%,transparent 92%,var(--bg))}
.records{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(26px,4.4vw,56px) clamp(16px,3.4vw,44px)}
.rec{position:relative;aspect-ratio:1;appearance:none;border:0;background:none;cursor:pointer;padding:0;transform:rotate(var(--r,0deg));transition:transform .5s cubic-bezier(.2,1.4,.4,1);outline:none}
.rec:nth-child(4n+2){--r:1.2deg}.rec:nth-child(4n+3){--r:-1deg}.rec:nth-child(5n){--r:.6deg}
/* 額（ジャケット枠） */
.rec .sleeve{position:absolute;inset:0;background:linear-gradient(145deg,#3a2614,#1b1009);border-radius:3px;
  box-shadow:0 0 0 2px #120a04,0 0 0 4px #5a3b1b,0 0 0 5px #120a04,0 18px 28px rgba(0,0,0,.75),inset 0 0 0 6px rgba(0,0,0,.35)}
.rec .sleeve::after{content:"";position:absolute;left:50%;top:-14px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6d77a,#7a5512);box-shadow:0 2px 3px rgba(0,0,0,.7)}
/* レコード本体＝ゲームの円盤 */
.rec .disc{position:absolute;inset:9%;border-radius:50%;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.7),0 0 0 1px rgba(246,215,122,.25);transition:transform .6s cubic-bezier(.2,1,.3,1)}
.rec .disc img{width:100%;height:100%;object-fit:cover}
.rec .disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen;pointer-events:none}
.rec .disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 210deg,transparent 0 40deg,rgba(255,255,255,.18) 60deg,transparent 80deg 220deg,rgba(255,255,255,.1) 240deg,transparent 260deg);pointer-events:none}
.rec .light{position:absolute;inset:-30% -20% auto;height:60%;background:radial-gradient(closest-side,rgba(255,220,150,.22),transparent);pointer-events:none;opacity:0;transition:opacity .4s}
.rec:hover,.rec:focus-visible,.rec.open{transform:rotate(0) translateY(-6px) scale(1.04);z-index:5}
.rec:hover .light,.rec:focus-visible .light,.rec.open .light{opacity:1}
.rec:hover .disc,.rec:focus-visible .disc{transform:translateX(14%) rotate(30deg)}
.rec.playing .disc{animation:turn 1.8s linear infinite}
.rec .no{position:absolute;left:8px;bottom:6px;font-family:var(--mincho);font-size:10px;letter-spacing:.2em;color:var(--mute);z-index:2}
.rec.lock .disc{filter:grayscale(1) brightness(.45)}
.rec.lock .soon{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-family:var(--mincho);font-size:11px;letter-spacing:.35em;color:var(--gold2)}
/* 曲の詳細カード */
.info{position:absolute;z-index:10;width:280px;padding:20px 20px 18px;border-radius:4px;pointer-events:none;opacity:0;transform:translateY(10px) scale(.97);transition:opacity .25s,transform .3s cubic-bezier(.2,1.3,.4,1);
  background:linear-gradient(180deg,rgba(30,20,10,.97),rgba(16,10,5,.97));box-shadow:0 0 0 1px rgba(246,215,122,.5),0 0 0 5px rgba(12,8,5,.9),0 0 0 6px rgba(217,165,33,.35),0 24px 50px rgba(0,0,0,.7)}
.info.on{opacity:1;transform:none;pointer-events:auto}
.info .gen{display:inline-block;font-size:10px;letter-spacing:.15em;color:#2a1406;background:var(--gold2);padding:2px 8px}
.info .gen.hymn{background:#cfe0f4}
.info h3{font-family:var(--mincho);font-weight:800;font-size:22px;letter-spacing:.08em;color:#fff3d6;margin:10px 0 2px;line-height:1.3}
.info .ps{font-size:11px;color:var(--mute);letter-spacing:.12em}
.info .ab{font-family:var(--mincho);font-size:14px;color:var(--gold2);margin:10px 0 12px;line-height:1.6}
.info dl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.info dl div{border:1px solid rgba(246,215,122,.25);padding:5px 0 4px}
.info dt{font-size:9px;letter-spacing:.12em;color:var(--mute)}
.info dd{font-family:var(--mincho);font-weight:800;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.info .bpm{margin-top:10px;font-size:10px;letter-spacing:.2em;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.info .listen{appearance:none;border:1px solid rgba(246,215,122,.6);background:none;border-radius:999px;padding:6px 14px;font-size:11px;letter-spacing:.2em;color:var(--gold2);cursor:pointer}
.info .listen[aria-pressed="true"]{background:var(--gold2);color:#2a1406}
.info .x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;display:none}
.room .tip{position:relative;text-align:center;margin-top:28px;font-size:10px;letter-spacing:.35em;color:var(--mute)}

/* ===== 全国ランキング ===== */
.rank{position:relative;padding:4svh 0 14svh}
.picker{display:flex;gap:14px;overflow-x:auto;padding:6px 20px 14px;scroll-snap-type:x mandatory;justify-content:safe center;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.pick{flex:none;width:64px;appearance:none;border:0;background:none;cursor:pointer;scroll-snap-align:center;display:grid;justify-items:center;gap:6px;opacity:.55;transition:opacity .25s,transform .25s}
.pick img{width:56px;height:56px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(246,215,122,.35),0 6px 14px rgba(0,0,0,.6)}
.pick span{font-size:9px;letter-spacing:.06em;color:var(--mute);white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.pick.on{opacity:1;transform:translateY(-3px)}
.pick.on img{box-shadow:0 0 0 2px var(--gold2),0 0 18px rgba(246,215,122,.5)}
.pick.on span{color:var(--gold2)}
.dtabs{display:flex;justify-content:center;gap:8px;margin:6px 0 22px;flex-wrap:wrap}
.dtab{appearance:none;cursor:pointer;background:none;border:1px solid rgba(246,215,122,.35);color:var(--mute);font-family:var(--mincho);font-weight:700;font-size:12px;letter-spacing:.12em;padding:7px 14px}
.dtab.on{border-color:var(--gold2);color:#2a1406;background:var(--gold2)}
.board{position:relative;width:min(560px,calc(100% - 32px));margin:0 auto;padding:26px 22px 20px;background:linear-gradient(180deg,rgba(30,20,10,.92),rgba(16,10,5,.95));
  box-shadow:0 0 0 1px rgba(246,215,122,.5),0 0 0 6px rgba(12,8,5,.9),0 0 0 7px rgba(217,165,33,.35),0 30px 60px rgba(0,0,0,.6)}
.board .ttl{text-align:center;font-family:var(--mincho);font-weight:800;font-size:18px;letter-spacing:.12em;color:#fff3d6}
.board .sub{text-align:center;font-size:10px;letter-spacing:.25em;color:var(--mute);margin:4px 0 16px}
.rows{list-style:none;display:grid;gap:2px}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(246,215,122,.12)}
.row .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mincho);font-weight:800;font-size:14px;color:var(--mute)}
.row:nth-child(1) .n{background:radial-gradient(circle at 35% 30%,#fff6d0,#d9a521 60%,#7a5512);color:#2a1406;box-shadow:0 0 14px rgba(246,215,122,.6)}
.row:nth-child(2) .n{background:radial-gradient(circle at 35% 30%,#ffffff,#c3cbd6 60%,#6c7480);color:#1d2026}
.row:nth-child(3) .n{background:radial-gradient(circle at 35% 30%,#ffe1c4,#c47a3c 60%,#6e3a14);color:#2a1406}
.row:nth-child(1) .nm{font-size:17px;color:var(--gold2)}
.row .nm{font-family:var(--mincho);font-weight:700;font-size:15px;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .nm small{display:block;font-family:var(--gothic);font-weight:400;font-size:9px;letter-spacing:.12em;color:var(--mute);margin-top:2px}
.row .sc{text-align:right;font-family:var(--mincho);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:#fff3d6}
.row .mk{display:block;width:max-content;margin:3px 0 0 auto;font-family:var(--gothic);font-size:9px;font-weight:700;letter-spacing:.1em;padding:2px 6px;vertical-align:middle;color:#2a1406;background:var(--gold2)}
.row .mk.ap{background:linear-gradient(90deg,#ff9ad5,#ffdf8a,#9fe3ff)}
.board .msg{text-align:center;font-size:12px;line-height:1.9;color:var(--mute);padding:26px 0}
.board .upd{text-align:right;font-size:9px;letter-spacing:.15em;color:#6f604c;margin-top:12px}
.board .go{display:block;text-align:center;margin-top:16px;font-size:12px;letter-spacing:.2em;color:var(--gold2)}
.info .torank{display:block;margin-top:12px;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--gold2);border-top:1px solid rgba(246,215,122,.2);padding-top:10px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;cursor:pointer}

/* ===== フッター ===== */
.foot{text-align:center;padding:4svh 20px 10svh}
.foot .start{opacity:1;animation:none;margin-top:0}
.foot p{margin-top:42px;font-size:10px;letter-spacing:.3em;color:#6f604c}

@media (max-width:760px){
  .records{grid-template-columns:repeat(3,1fr)}
  .info{position:fixed;left:12px!important;right:12px;top:auto!important;bottom:calc(12px + env(safe-area-inset-bottom));width:auto}
  .info .x{display:block}
}
@media (max-width:420px){.records{grid-template-columns:repeat(2,1fr)}}

@keyframes rise{to{opacity:1;transform:none}}
@keyframes logoIn{from{opacity:0;transform:translate(-50%,-80%) scale(1.25)}to{opacity:1;transform:translate(-50%,-80%) scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes shine{0%{background-position:150% 0}45%,100%{background-position:-60% 0}}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rec.playing .disc{animation:none}}
</style>
</head>
<body>

<section class="hero">
  <canvas id="beat" aria-hidden="true"></canvas>
  <div class="stage">
    <div class="frame"></div>
    <video id="pv" src="assets/pv.mp4" poster="assets/poster.jpg" autoplay muted loop playsinline></video>
    <img class="logo" src="assets/logo.png" alt="SIHEN BEET">
    <div class="catch"><span>詩篇を打つリズムゲーム</span></div>
    <button class="sound" id="snd" aria-label="音声オン">🔇</button>
  </div>
  <a class="start" href="https://sihen-beet.vercel.app/" target="_blank" rel="noopener">ゲームを始める</a>
  <div class="scroll">SCROLL</div>
</section>

<section class="words">
  <div class="poem" id="poem">
    <p>わが岩なる主はほむべきかな。</p>
    <p class="gap">主は、いくさすることを</p>
    <p>わが手に教え、</p>
    <p>戦うことを</p>
    <p>わが<em>指</em>に教えられます。</p>
    <p class="gap">神よ、わたしは<em>新しい歌</em>を</p>
    <p>あなたにむかって歌い、</p>
    <p>十弦の立琴にあわせて</p>
    <p>あなたをほめうたいます。</p>
    <p class="gap">詩篇 第百四十四篇</p>
  </div>
</section>

<section class="room" id="room">
  <div class="head"><small>LINEUP</small><h2>収録曲</h2></div>
  <div class="wall" id="wall">
    <div class="records" id="records"></div>
    <div class="info" id="info" role="dialog" aria-live="polite">
      <button class="x" id="infoX" aria-label="閉じる">×</button>
      <span class="gen" id="iGen"></span>
      <h3 id="iTitle"></h3>
      <div class="ps" id="iPs"></div>
      <div class="ab" id="iAb"></div>
      <dl id="iLv"></dl>
      <div class="bpm"><span id="iBpm"></span><button class="listen" id="iListen" aria-pressed="false">▶ 試聴</button></div>
      <button class="torank" id="iRank">🏆 この曲のランキングを見る</button>
    </div>
  </div>
  <p class="tip" id="tip">レコードにふれると、曲の詳細</p>
</section>

<section class="rank" id="rank">
  <div class="head"><small>RANKING</small><h2>全国ランキング</h2></div>
  <div class="picker" id="picker"></div>
  <div class="dtabs" id="dtabs"></div>
  <div class="board">
    <div class="ttl" id="rTtl"></div>
    <div class="sub" id="rSub">TOP 10</div>
    <ol class="rows" id="rows"></ol>
    <div class="upd" id="rUpd"></div>
    <a class="go" href="https://sihen-beet.vercel.app/" target="_blank" rel="noopener">あなたもランクインをねらう ▶</a>
  </div>
</section>

<footer class="foot">
  <a class="start" href="https://sihen-beet.vercel.app/" target="_blank" rel="noopener">ゲームを始める</a>
  <p>© SIHEN BEET</p>
</footer>

<audio id="aud" preload="none"></audio>

<script>
// [id, 曲名, 出典, ジャンル, ひとこと, BPM, [NORMAL,HARD,EXPERT,KIDS], 試聴ファイル]
const SONGS=[

const recs=document.getElementById('records'),info=document.getElementById('info'),wall=document.getElementById('wall');
SONGS.forEach((s,i)=>{
  const b=document.createElement('button');b.className='rec'+(s[6]?'':' lock');b.type='button';b.dataset.i=i;b.setAttribute('aria-label',s[1]+' の詳細');
  b.innerHTML='<div class="light"></div><div class="sleeve"></div><div class="disc"><img alt="" loading="lazy"></div><span class="no">No.'+String(i+1).padStart(2,'0')+'</span>'+(s[6]?'':'<span class="soon">COMING SOON</span>');
  b.querySelector('img').src='assets/disc_'+s[0]+'.jpg';recs.appendChild(b);
});

// 部屋の写真（Gemini）が届いていれば、それを壁に使う
(()=>{const im=new Image();im.onload=()=>{wall.style.setProperty('--room','url(assets/room.webp)');wall.classList.add('photo')};im.src='assets/room.webp'})();

let cur=null,pinned=false;const aud=document.getElementById('aud'),lis=document.getElementById('iListen');
function show(b){
  const s=SONGS[+b.dataset.i];cur&&cur.classList.remove('open');cur=b;b.classList.add('open');
  const g=document.getElementById('iGen');g.textContent=s[3];g.className='gen'+(s[3]==='讃美歌'?' hymn':'');
  document.getElementById('iTitle').textContent=s[1];document.getElementById('iPs').textContent=s[2];document.getElementById('iAb').textContent=s[4];
  const lv=document.getElementById('iLv');lv.innerHTML='';
  if(s[6])['NORMAL','HARD','EXPERT','KIDS'].forEach((n,k)=>{const d=document.createElement('div');d.innerHTML='<dt></dt><dd></dd>';d.querySelector('dt').textContent=n==='KIDS'?'キッズ':n;d.querySelector('dd').textContent=s[6][k];lv.appendChild(d)});
  lv.style.display=s[6]?'':'none';
  document.getElementById('iBpm').textContent=s[5]?'BPM '+s[5]:'';lis.style.display=s[7]?'':'none';document.getElementById('iRank').style.display=s[6]?'':'none';
  lis.setAttribute('aria-pressed',String(!aud.paused&&aud.dataset.i===b.dataset.i));
  if(matchMedia('(min-width:761px)').matches){ // カードはレコードの横に
    const wr=wall.getBoundingClientRect(),r=b.getBoundingClientRect();let x=r.right-wr.left+18,y=r.top-wr.top-10;
    if(x+290>wr.width)x=r.left-wr.left-298;info.style.left=x+'px';info.style.top=Math.max(10,y)+'px'}
  info.classList.add('on');
}
function hide(){if(pinned)return;info.classList.remove('on');cur&&cur.classList.remove('open');cur=null}
recs.querySelectorAll('.rec').forEach(b=>{
  b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){pinned=false;show(b)}});
  b.addEventListener('focus',()=>show(b));
  b.addEventListener('click',()=>{pinned=true;show(b)});
});
wall.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide()});
document.getElementById('infoX').addEventListener('click',()=>{pinned=false;hide()});
document.addEventListener('click',e=>{if(!e.target.closest('.rec,.info')){pinned=false;hide()}});
lis.addEventListener('click',()=>{
  const i=cur.dataset.i,s=SONGS[+i];
  if(!aud.paused&&aud.dataset.i===i){aud.pause();return}
  aud.src='assets/pv_'+s[7]+'.mp3';aud.dataset.i=i;aud.play().catch(()=>{});
  const v=document.getElementById('pv');v.muted=true;document.getElementById('snd').textContent='🔇';
});
const mark=()=>{recs.querySelectorAll('.rec').forEach(b=>b.classList.toggle('playing',!aud.paused&&aud.dataset.i===b.dataset.i));lis.setAttribute('aria-pressed',String(!!cur&&!aud.paused&&aud.dataset.i===cur.dataset.i))};
aud.addEventListener('play',mark);aud.addEventListener('pause',mark);aud.addEventListener('ended',mark);
if(!matchMedia('(hover:hover)').matches)document.getElementById('tip').textContent='レコードをタップすると、曲の詳細';

// ===== 全国ランキング（ゲームと同じデータ） =====
const SB={url:'https://kdzedfffbgtloyvjexjf.supabase.co',key:'sb_publishable_2yFicxMxEixzXQ5YL65zYA_o4XoNQHI'};
const DIFFS=['NORMAL','HARD','EXPERT','KIDS'];let rSong='goliath',rDiff='NORMAL',rTimer=0;
const picker=document.getElementById('picker'),dtabs=document.getElementById('dtabs'),rowsEl=document.getElementById('rows');
SONGS.filter(s=>s[6]).forEach(s=>{const b=document.createElement('button');b.className='pick';b.type='button';b.dataset.id=s[0];
  b.innerHTML='<img alt="" loading="lazy"><span></span>';b.querySelector('img').src='assets/disc_'+s[0]+'.jpg';b.querySelector('span').textContent=s[1];
  b.addEventListener('click',()=>{rSong=s[0];loadRank()});picker.appendChild(b)});
DIFFS.forEach(d=>{const b=document.createElement('button');b.className='dtab';b.type='button';b.dataset.d=d;b.textContent=d==='KIDS'?'キッズ':d;
  b.addEventListener('click',()=>{rDiff=d;loadRank()});dtabs.appendChild(b)});
function msg(t){rowsEl.innerHTML='';const li=document.createElement('li');li.className='msg';li.textContent=t;rowsEl.appendChild(li)}
async function loadRank(){
  const s=SONGS.find(x=>x[0]===rSong);
  picker.querySelectorAll('.pick').forEach(b=>b.classList.toggle('on',b.dataset.id===rSong));
  dtabs.querySelectorAll('.dtab').forEach(b=>b.classList.toggle('on',b.dataset.d===rDiff));
  document.getElementById('rTtl').textContent=s[1];document.getElementById('rSub').textContent=(rDiff==='KIDS'?'キッズ':rDiff)+' ・ TOP 10';
  clearTimeout(rTimer);rTimer=setTimeout(loadRank,60000);
  try{
    const q='/rest/v1/beet_scores?select=name,score,mark,combo,updated_at&song=eq.'+encodeURIComponent(rSong)+'&diff=eq.'+rDiff+'&order=score.desc,updated_at.asc&limit=10';
    const r=await fetch(SB.url+q,{headers:{apikey:SB.key}});if(!r.ok)throw new Error(r.status);
    const rows=await r.json();if(rSong!==s[0])return;
    rowsEl.innerHTML='';
    if(!rows.length){msg('まだ記録がありません。最初の1位になろう！')}
    rows.forEach((x,i)=>{const li=document.createElement('li');li.className='row';
      const n=document.createElement('span');n.className='n';n.textContent=i+1;
      const nm=document.createElement('span');nm.className='nm';nm.textContent=x.name||'ななしの羊飼い';
      const sm=document.createElement('small');const d=new Date(x.updated_at);sm.textContent=(d.getMonth()+1)+'/'+d.getDate()+'　COMBO '+(x.combo||0);nm.appendChild(sm);
      const sc=document.createElement('span');sc.className='sc';sc.textContent=(+x.score).toLocaleString();
      if(x.mark){const mk=document.createElement('span');mk.className='mk'+(x.mark==='AP'?' ap':'');mk.textContent=x.mark==='AP'?'ALL PERFECT':'FULL COMBO';sc.appendChild(mk)}
      li.append(n,nm,sc);rowsEl.appendChild(li)});
    const t=new Date();document.getElementById('rUpd').textContent='更新 '+t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
  }catch(e){msg('ランキングを読みこめませんでした。公式サイト sihen-beet.vercel.app/hp でご覧ください。')}
}
const rio=new IntersectionObserver(es=>{if(es[0].isIntersecting){loadRank();rio.disconnect()}},{rootMargin:'300px'});rio.observe(document.getElementById('rank'));
document.getElementById('iRank').addEventListener('click',()=>{const s=SONGS[+cur.dataset.i];if(!s[6])return;rSong=s[0];pinned=false;hide();loadRank();document.getElementById('rank').scrollIntoView({behavior:'smooth'})});

const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.35});
const poem=document.getElementById('poem'); io.observe(poem);
poem.querySelectorAll('p').forEach((p,i)=>p.style.transitionDelay=(i*.4)+'s');

const v=document.getElementById('pv'), snd=document.getElementById('snd');

// ===== 星ビート：曲の拍ごとに、上から星が降ってくる（PVの中心はよける） =====
(()=>{
  const cv=document.getElementById('beat'),g=cv.getContext('2d'),hero=document.querySelector('.hero'),stage=document.querySelector('.stage'),root=document.documentElement;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const SPB=60/190.035,B0=0.023,SONG0=36.9;   // hero video t=0 = song time 36.9s (GOLIATH BREAKER, BPM190)
  let W=0,H=0,last=-1,stars=[],prev=performance.now(),flash=0;
  function fit(){const d=Math.min(2,devicePixelRatio||1);W=hero.clientWidth;H=hero.clientHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
  addEventListener('resize',fit);fit();
  // x outside the framed video when there is room, otherwise along the screen edges
  function laneX(){const h=hero.getBoundingClientRect(),r=stage.getBoundingClientRect(),fx=r.width*.3;
    const L=r.left-h.left-fx,Rr=r.right-h.left+fx;
    if(L>60)return Math.random()<.5?Math.random()*(L-10):Rr+10+Math.random()*(W-Rr-10);
    const band=Math.max(36,W*.2);return Math.random()<.5?Math.random()*band:W-Math.random()*band}
  function star(big){stars.push({x:laneX(),y:-20-Math.random()*40,vy:(big?260:150)+Math.random()*120,vx:(Math.random()-.5)*20+(big?-40:0),
    r:big?5+Math.random()*2:1.8+Math.random()*2.4,big,t:performance.now(),spin:Math.random()*6,life:big?2200:1800+Math.random()*1600})}
  function sparkle(x,y,r,a,rot){g.save();g.translate(x,y);g.rotate(rot);g.globalAlpha=a;
    const gr=g.createRadialGradient(0,0,0,0,0,r*4);gr.addColorStop(0,'rgba(255,240,190,.9)');gr.addColorStop(.25,'rgba(246,215,122,.35)');gr.addColorStop(1,'rgba(246,215,122,0)');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,r*4,0,7);g.fill();
    g.fillStyle='#fff6d6';g.beginPath();g.moveTo(0,-r*2.6);g.quadraticCurveTo(r*.25,-r*.25,r*2.6,0);g.quadraticCurveTo(r*.25,r*.25,0,r*2.6);g.quadraticCurveTo(-r*.25,r*.25,-r*2.6,0);g.quadraticCurveTo(-r*.25,-r*.25,0,-r*2.6);g.fill();g.restore()}
  function frame(now){
    requestAnimationFrame(frame);const dt=Math.min(.05,(now-prev)/1000);prev=now;
    const rr=hero.getBoundingClientRect();if(rr.bottom<0||rr.top>innerHeight)return;
    g.clearRect(0,0,W,H);
    const ph=((v.currentTime||0)+SONG0-B0)/SPB,k=Math.floor(ph),f=ph-k,on=!v.paused;
    if(on&&k!==last){if(last>=0&&k>last){const down=k%4===0;
        if(down)star(true);for(let i=0;i<(down?4:2);i++)star(false);flash=down?1:.6}
      last=k}
    flash=Math.max(0,flash-dt*3.2);
    const env=on?Math.pow(1-f,3)*(k%4===0?1:.6):0;
    root.style.setProperty('--beat',env.toFixed(3));
    stars=stars.filter(s=>{const age=(now-s.t)/1000,p=age*1000/s.life;if(p>1)return false;
      const x=s.x+s.vx*age,y=s.y+s.vy*age;if(y>H+40)return false;
      const fade=p<.08?p/.08:1-Math.pow((p-.08)/.92,2),tw=1+flash*(s.big?.6:1.1);  // every star twinkles on the beat
      // trail
      const tl=s.big?90:28+s.r*6,ang=Math.atan2(s.vy,s.vx);
      const tg=g.createLinearGradient(x,y,x-Math.cos(ang)*tl,y-Math.sin(ang)*tl);tg.addColorStop(0,'rgba(246,215,122,'+(.5*fade).toFixed(3)+')');tg.addColorStop(1,'rgba(246,215,122,0)');
      g.strokeStyle=tg;g.lineWidth=s.big?2:1;g.beginPath();g.moveTo(x,y);g.lineTo(x-Math.cos(ang)*tl,y-Math.sin(ang)*tl);g.stroke();
      sparkle(x,y,s.r*tw,Math.min(1,fade*(.75+flash*.4)),s.spin+age*(s.big?2:1));return true});
  }
  requestAnimationFrame(frame);
})();
snd.addEventListener('click',()=>{ v.muted=!v.muted; snd.textContent=v.muted?'🔇':'🔊'; if(!v.muted){ aud.pause(); v.play().catch(()=>{}); } });
